name: Odaseva
description: >-
  Odaseva is an enterprise data security, backup, and governance platform purpose-built
  for large, complex Salesforce environments. It provides data backup and recovery,
  archiving, seeding and anonymization/masking, encryption and key management, privacy
  and data-residency controls, and data governance for regulated enterprises. Odaseva
  holds SOC 2 Type II, ISO 27001:2022, HITRUST, HIPAA, GDPR, CCPA, TISAX, IRAP, MLPS 2.0,
  and CSA STAR Level 2, with independent audits by Ernst & Young. Surfaced as a portfolio
  company of Partech and added to the API Evangelist network; Odaseva sells to enterprises
  and does not publish a public developer API portal, OpenAPI, or SDKs at this time.
