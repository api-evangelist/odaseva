    that would describe it lives only in the customer knowledge base behind
    platform.odaseva.com/CBR; there is no developer subdomain at all (docs., developer.,
    api-docs. and ten other candidates are NXDOMAIN) and the 376-URL sitemap contains no
    API, developer or documentation URL.
