name: Odaseva
description: >-
  Odaseva is an enterprise data security, backup, and governance platform purpose-built
  for large, complex Salesforce environments. It provides data backup and recovery,
  archiving, seeding and anonymization/masking, encryption and key management, privacy
  and data-residency controls, and data governance for regulated enterprises. Odaseva
  holds SOC 2 Type II, ISO 27001:2022, HITRUST, HIPAA, GDPR, CCPA, TISAX, IRAP, MLPS 2.0,
  and CSA STAR Level 2, with independent audits by Ernst & Young. Surfaced as a portfolio
  company of Partech and added to the API Evangelist network. Odaseva runs as a
  Salesforce-hosted application (api.odaseva.com and platform.odaseva.com are Salesforce My
  Domain hosts) and does have a versioned Odaseva Platform API, but it is customer-gated:
  every unauthenticated request returns a Salesforce login challenge and there is no public
  developer portal, OpenAPI, or reference. The one publicly installable client is the
  first-party Odaseva CLI on npm, last released 2022-12-09; no server-side SDK is published
  on any registry. Odaseva runs an Atlassian Statuspage at trust.odaseva.com.
